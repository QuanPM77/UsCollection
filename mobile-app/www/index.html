<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E8829A" />
    <title>UsStory</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #FFF8F9; color: #7D2E46; font: 16px/1.55 system-ui, sans-serif; text-align: center; }
      main { max-width: 380px; }
      .mark { display: grid; width: 92px; height: 92px; margin: 0 auto 24px; place-items: center; border-radius: 28px; background: #E8829A; color: #fff; font-size: 56px; }
      h1 { margin: 0; font-size: 28px; }
      p { color: #986477; }
      code { overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">♡</div>
      <h1>UsStory</h1>
      <p>App điện thoại riêng của UsStory đang chờ địa chỉ website đã triển khai. Hãy cấu hình <code>CAPACITOR_SERVER_URL</code> rồi đồng bộ lại app.</p>
    </main>
  </body>
</html>
